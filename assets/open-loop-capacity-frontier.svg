<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Open-loop capacity frontier: client output TPS vs p95 TTFT</title>
  <desc id="desc">Scatter/line chart showing that output throughput improves only modestly after 5 rps while p95 TTFT increases sharply.</desc>
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Open-loop capacity frontier</text>
  <text x="430" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Client output TPS vs p95 TTFT, latest authenticated-metrics run</text>

  <rect x="78" y="78" width="704" height="262" fill="#f9fafb" stroke="#e5e7eb"/>
  <line x1="78" y1="340" x2="782" y2="340" stroke="#111827" stroke-width="1"/>
  <line x1="78" y1="78" x2="78" y2="340" stroke="#111827" stroke-width="1"/>

  <g stroke="#e5e7eb">
    <line x1="78" y1="340" x2="782" y2="340"/>
    <line x1="78" y1="281.3" x2="782" y2="281.3"/>
    <line x1="78" y1="222.6" x2="782" y2="222.6"/>
    <line x1="78" y1="163.9" x2="782" y2="163.9"/>
    <line x1="78" y1="105.2" x2="782" y2="105.2"/>
    <line x1="78" y1="340" x2="78" y2="78"/>
    <line x1="234.4" y1="340" x2="234.4" y2="78"/>
    <line x1="390.9" y1="340" x2="390.9" y2="78"/>
    <line x1="547.3" y1="340" x2="547.3" y2="78"/>
    <line x1="703.8" y1="340" x2="703.8" y2="78"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
    <text x="68" y="344" text-anchor="end">0</text>
    <text x="68" y="285.3" text-anchor="end">500</text>
    <text x="68" y="226.6" text-anchor="end">1000</text>
    <text x="68" y="167.9" text-anchor="end">1500</text>
    <text x="68" y="109.2" text-anchor="end">2000</text>
    <text x="78" y="362" text-anchor="middle">0s</text>
    <text x="234.4" y="362" text-anchor="middle">4s</text>
    <text x="390.9" y="362" text-anchor="middle">8s</text>
    <text x="547.3" y="362" text-anchor="middle">12s</text>
    <text x="703.8" y="362" text-anchor="middle">16s</text>
    <text x="430" y="392" text-anchor="middle" font-size="12" fill="#111827">p95 TTFT</text>
    <text transform="translate(24 209) rotate(-90)" text-anchor="middle" font-size="12" fill="#111827">Client output tokens/s</text>
  </g>

  <rect x="78" y="78" width="117.3" height="262" fill="#ecfdf5" opacity="0.85"/>
  <text x="90" y="96" font-family="Arial, sans-serif" font-size="11" fill="#047857">sub-second TTFT</text>
  <line x1="273.6" y1="78" x2="273.6" y2="340" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="281" y="96" font-family="Arial, sans-serif" font-size="11" fill="#92400e">5s TTFT</text>

  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="98.8,236.6 103.3,106.2 291.8,113.3 556.0,81.5 755.0,81.3"/>
  <g fill="#2563eb">
    <circle cx="98.8" cy="236.6" r="5"/>
    <circle cx="103.3" cy="106.2" r="5"/>
    <circle cx="291.8" cy="113.3" r="5"/>
    <circle cx="556.0" cy="81.5" r="5"/>
    <circle cx="755.0" cy="81.3" r="5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#111827">
    <text x="87" y="254" text-anchor="end">2 rps</text>
    <text x="113" y="101">5 rps</text>
    <text x="302" y="116">6 rps</text>
    <text x="566" y="84">8 rps</text>
    <text x="738" y="76" text-anchor="end">10 rps</text>
  </g>

  <rect x="548" y="276" width="214" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="562" y="296" font-family="Arial, sans-serif" font-size="12" fill="#111827">Past 5 rps, throughput flattens</text>
  <text x="562" y="313" font-family="Arial, sans-serif" font-size="12" fill="#111827">while TTFT rises sharply.</text>
</svg>
