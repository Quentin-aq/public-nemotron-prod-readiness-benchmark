<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">vLLM scheduler pressure: running vs waiting requests</title>
  <desc id="desc">Line chart showing requests running reaching 64 at 6 rps while waiting requests rise from 0 at 5 rps to 58 at 10 rps.</desc>
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">vLLM scheduler pressure</text>
  <text x="430" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Running requests hit the max_num_seqs=64 region; waiting requests then explain TTFT growth</text>

  <rect x="72" y="78" width="720" height="262" fill="#f9fafb" stroke="#e5e7eb"/>
  <line x1="72" y1="340" x2="792" y2="340" stroke="#111827" stroke-width="1"/>
  <line x1="72" y1="78" x2="72" y2="340" stroke="#111827" stroke-width="1"/>

  <line x1="72" y1="340" x2="792" y2="340" stroke="#e5e7eb"/>
  <text x="62" y="344" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">0</text>
  <line x1="72" y1="265.1" x2="792" y2="265.1" stroke="#e5e7eb"/>
  <text x="62" y="269.1" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">20</text>
  <line x1="72" y1="190.3" x2="792" y2="190.3" stroke="#e5e7eb"/>
  <text x="62" y="194.3" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">40</text>
  <line x1="72" y1="115.4" x2="792" y2="115.4" stroke="#e5e7eb"/>
  <text x="62" y="119.4" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">60</text>
  <line x1="72" y1="100.5" x2="792" y2="100.5" stroke="#9ca3af" stroke-dasharray="5 5"/>
  <text x="782" y="96" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">max_num_seqs=64</text>

  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="90,336.3 145,336.3 200,328.8 255,325.0 310,317.5 365,313.8 420,298.8 475,250.1 530,190.3 585,122.8 640,100.5 695,100.5 750,100.5"/>
  <polyline fill="none" stroke="#dc2626" stroke-width="3" points="90,340.0 145,340.0 200,340.0 255,340.0 310,340.0 365,340.0 420,340.0 475,340.0 530,340.0 585,340.0 640,268.9 695,186.6 750,122.8"/>

  <g fill="#2563eb">
    <circle cx="90" cy="336.3" r="3.5"/><circle cx="145" cy="336.3" r="3.5"/><circle cx="200" cy="328.8" r="3.5"/><circle cx="255" cy="325.0" r="3.5"/><circle cx="310" cy="317.5" r="3.5"/><circle cx="365" cy="313.8" r="3.5"/><circle cx="420" cy="298.8" r="3.5"/><circle cx="475" cy="250.1" r="3.5"/><circle cx="530" cy="190.3" r="3.5"/><circle cx="585" cy="122.8" r="3.5"/><circle cx="640" cy="100.5" r="3.5"/><circle cx="695" cy="100.5" r="3.5"/><circle cx="750" cy="100.5" r="3.5"/>
  </g>
  <g fill="#dc2626">
    <circle cx="90" cy="340.0" r="3.5"/><circle cx="145" cy="340.0" r="3.5"/><circle cx="200" cy="340.0" r="3.5"/><circle cx="255" cy="340.0" r="3.5"/><circle cx="310" cy="340.0" r="3.5"/><circle cx="365" cy="340.0" r="3.5"/><circle cx="420" cy="340.0" r="3.5"/><circle cx="475" cy="340.0" r="3.5"/><circle cx="530" cy="340.0" r="3.5"/><circle cx="585" cy="340.0" r="3.5"/><circle cx="640" cy="268.9" r="3.5"/><circle cx="695" cy="186.6" r="3.5"/><circle cx="750" cy="122.8" r="3.5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
    <text x="90" y="362" text-anchor="middle">0.25</text>
    <text x="145" y="362" text-anchor="middle">0.5</text>
    <text x="200" y="362" text-anchor="middle">0.75</text>
    <text x="255" y="362" text-anchor="middle">1</text>
    <text x="310" y="362" text-anchor="middle">1.25</text>
    <text x="365" y="362" text-anchor="middle">1.5</text>
    <text x="420" y="362" text-anchor="middle">2</text>
    <text x="475" y="362" text-anchor="middle">3</text>
    <text x="530" y="362" text-anchor="middle">4</text>
    <text x="585" y="362" text-anchor="middle">5</text>
    <text x="640" y="362" text-anchor="middle">6</text>
    <text x="695" y="362" text-anchor="middle">8</text>
    <text x="750" y="362" text-anchor="middle">10</text>
    <text x="430" y="392" text-anchor="middle" font-size="12" fill="#111827">Offered load (rps)</text>
    <text transform="translate(22 209) rotate(-90)" text-anchor="middle" font-size="12" fill="#111827">Requests</text>
  </g>

  <rect x="578" y="81" width="196" height="54" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="594" y1="100" x2="624" y2="100" stroke="#2563eb" stroke-width="3"/>
  <text x="632" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">maxRequestsRunning</text>
  <line x1="594" y1="122" x2="624" y2="122" stroke="#dc2626" stroke-width="3"/>
  <text x="632" y="126" font-family="Arial, sans-serif" font-size="12" fill="#111827">maxRequestsWaiting</text>
</svg>
