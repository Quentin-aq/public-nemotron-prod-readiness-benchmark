<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Nemotron load test: concurrence vs output TPS systeme</title>
  <desc id="desc">Line chart showing system output token throughput rising to about 5215 tokens per second at concurrency 256, then plateauing around 5k tokens per second.</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Concurrence vs output TPS systeme</text>
  <text x="410" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Payload throughput, stream=true, max_tokens=512</text>
  <line x1="60" y1="300" x2="780" y2="300" stroke="#111827" stroke-width="1"/>
  <line x1="60" y1="60" x2="60" y2="300" stroke="#111827" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#4b5563">
    <text x="56" y="304" text-anchor="end">0</text>
    <text x="56" y="217" text-anchor="end">2k</text>
    <text x="56" y="129" text-anchor="end">4k</text>
    <text x="56" y="64" text-anchor="end">5.5k</text>
    <text x="60" y="322" text-anchor="middle">1</text>
    <text x="146" y="322" text-anchor="middle">64</text>
    <text x="234" y="322" text-anchor="middle">128</text>
    <text x="409" y="322" text-anchor="middle">256</text>
    <text x="585" y="322" text-anchor="middle">384</text>
    <text x="760" y="322" text-anchor="middle">512</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="60" y1="212.7" x2="780" y2="212.7"/>
    <line x1="60" y1="125.5" x2="780" y2="125.5"/>
    <line x1="60" y1="60" x2="780" y2="60"/>
  </g>
  <line x1="60" y1="81.8" x2="780" y2="81.8" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="772" y="76" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#f97316">plateau ~5k tokens/s</text>
  <polyline fill="none" stroke="#7c3aed" stroke-width="3" points="60,291.4 61.4,285.5 64.1,273.5 69.6,258.5 75.1,247.9 80.5,240.4 91.5,197.8 102.5,172.2 124.4,163 146.3,98.7 190.1,104.8 234,107.1 321.6,81.8 409.3,72.4 584.7,98 760,82.1"/>
  <g fill="#7c3aed" stroke="#ffffff" stroke-width="1.5">
    <circle cx="60" cy="291.4" r="4"/><circle cx="61.4" cy="285.5" r="4"/><circle cx="64.1" cy="273.5" r="4"/><circle cx="69.6" cy="258.5" r="4"/><circle cx="75.1" cy="247.9" r="4"/><circle cx="80.5" cy="240.4" r="4"/><circle cx="91.5" cy="197.8" r="4"/><circle cx="102.5" cy="172.2" r="4"/><circle cx="124.4" cy="163" r="4"/><circle cx="146.3" cy="98.7" r="4"/><circle cx="190.1" cy="104.8" r="4"/><circle cx="234" cy="107.1" r="4"/><circle cx="321.6" cy="81.8" r="4"/><circle cx="409.3" cy="72.4" r="4"/><circle cx="584.7" cy="98" r="4"/><circle cx="760" cy="82.1" r="4"/>
  </g>
  <text x="410" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#111827">Concurrence</text>
  <text x="18" y="180" text-anchor="middle" transform="rotate(-90 18 180)" font-family="Arial, sans-serif" font-size="12" fill="#111827">Output tokens/s</text>
</svg>
