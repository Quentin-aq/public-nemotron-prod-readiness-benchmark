<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Nemotron load test: concurrence vs p95 e2e latency</title>
  <desc id="desc">Line chart showing p95 end-to-end latency increasing from 2809 ms at concurrency 1 to 50467 ms at concurrency 512.</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Concurrence vs p95 e2e latency</text>
  <text x="410" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Payload throughput, stream=true, max_tokens=512</text>
  <line x1="60" y1="300" x2="780" y2="300" stroke="#111827" stroke-width="1"/>
  <line x1="60" y1="60" x2="60" y2="300" stroke="#111827" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#4b5563">
    <text x="56" y="304" text-anchor="end">0</text>
    <text x="56" y="212" text-anchor="end">20s</text>
    <text x="56" y="120" text-anchor="end">40s</text>
    <text x="56" y="64" text-anchor="end">52s</text>
    <text x="60" y="322" text-anchor="middle">1</text>
    <text x="146" y="322" text-anchor="middle">64</text>
    <text x="234" y="322" text-anchor="middle">128</text>
    <text x="409" y="322" text-anchor="middle">256</text>
    <text x="585" y="322" text-anchor="middle">384</text>
    <text x="760" y="322" text-anchor="middle">512</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="60" y1="207.7" x2="780" y2="207.7"/>
    <line x1="60" y1="115.4" x2="780" y2="115.4"/>
    <line x1="60" y1="60" x2="780" y2="60"/>
  </g>
  <line x1="60" y1="161.5" x2="780" y2="161.5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="772" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">seuil prod 30s</text>
  <polyline fill="none" stroke="#059669" stroke-width="3" points="60,287 61.4,285.4 64.1,283.2 69.6,283.1 75.1,279.8 80.5,281.8 91.5,276.1 102.5,274.1 124.4,271.7 146.3,267.4 190.1,236.1 234,232.7 321.6,209.3 409.3,188.4 584.7,108.9 760,67.1"/>
  <g fill="#059669" stroke="#ffffff" stroke-width="1.5">
    <circle cx="60" cy="287" r="4"/><circle cx="61.4" cy="285.4" r="4"/><circle cx="64.1" cy="283.2" r="4"/><circle cx="69.6" cy="283.1" r="4"/><circle cx="75.1" cy="279.8" r="4"/><circle cx="80.5" cy="281.8" r="4"/><circle cx="91.5" cy="276.1" r="4"/><circle cx="102.5" cy="274.1" r="4"/><circle cx="124.4" cy="271.7" r="4"/><circle cx="146.3" cy="267.4" r="4"/><circle cx="190.1" cy="236.1" r="4"/><circle cx="234" cy="232.7" r="4"/><circle cx="321.6" cy="209.3" r="4"/><circle cx="409.3" cy="188.4" r="4"/><circle cx="584.7" cy="108.9" r="4"/><circle cx="760" cy="67.1" r="4"/>
  </g>
  <text x="410" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#111827">Concurrence</text>
  <text x="18" y="180" text-anchor="middle" transform="rotate(-90 18 180)" font-family="Arial, sans-serif" font-size="12" fill="#111827">p95 e2e latency</text>
</svg>
