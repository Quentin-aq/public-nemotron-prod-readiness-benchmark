<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">The TTFT wall</title>
  <desc id="desc">Line chart showing p95 TTFT staying below one second through 5 rps, then rising to 5.47 seconds at 6 rps and 17.3 seconds at 10 rps.</desc>
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">The TTFT wall</text>
  <text x="430" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Flat through 5 rps, then queueing makes first-token latency jump</text>

  <rect x="78" y="78" width="704" height="262" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="78" y="78" width="528" height="262" fill="#ecfdf5" opacity="0.85"/>
  <rect x="606" y="78" width="58.7" height="262" fill="#fffbeb" opacity="0.85"/>
  <rect x="664.7" y="78" width="117.3" height="262" fill="#fef2f2" opacity="0.85"/>

  <line x1="78" y1="340" x2="782" y2="340" stroke="#111827" stroke-width="1"/>
  <line x1="78" y1="78" x2="78" y2="340" stroke="#111827" stroke-width="1"/>
  <g stroke="#e5e7eb">
    <line x1="78" y1="340" x2="782" y2="340"/>
    <line x1="78" y1="267.2" x2="782" y2="267.2"/>
    <line x1="78" y1="194.4" x2="782" y2="194.4"/>
    <line x1="78" y1="121.7" x2="782" y2="121.7"/>
  </g>
  <line x1="78" y1="325.4" x2="782" y2="325.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="78" y1="267.2" x2="782" y2="267.2" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 5"/>

  <polyline fill="none" stroke="#dc2626" stroke-width="3" points="78,331.6 136.7,332.1 195.3,331.4 254,331.4 312.7,332.0 371.3,332.2 430,332.2 488.7,331.5 547.3,331.3 606,330.6 664.7,260.4 723.3,162.1 782,88.2"/>
  <g fill="#dc2626">
    <circle cx="78" cy="331.6" r="3.5"/><circle cx="136.7" cy="332.1" r="3.5"/><circle cx="195.3" cy="331.4" r="3.5"/><circle cx="254" cy="331.4" r="3.5"/><circle cx="312.7" cy="332.0" r="3.5"/><circle cx="371.3" cy="332.2" r="3.5"/><circle cx="430" cy="332.2" r="3.5"/><circle cx="488.7" cy="331.5" r="3.5"/><circle cx="547.3" cy="331.3" r="3.5"/><circle cx="606" cy="330.6" r="4.5"/><circle cx="664.7" cy="260.4" r="4.5"/><circle cx="723.3" cy="162.1" r="4.5"/><circle cx="782" cy="88.2" r="4.5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
    <text x="68" y="344" text-anchor="end">0s</text>
    <text x="68" y="271.2" text-anchor="end">5s</text>
    <text x="68" y="198.4" text-anchor="end">10s</text>
    <text x="68" y="125.7" text-anchor="end">15s</text>
    <text x="78" y="362" text-anchor="middle">0.25</text>
    <text x="136.7" y="362" text-anchor="middle">0.5</text>
    <text x="195.3" y="362" text-anchor="middle">0.75</text>
    <text x="254" y="362" text-anchor="middle">1</text>
    <text x="312.7" y="362" text-anchor="middle">1.25</text>
    <text x="371.3" y="362" text-anchor="middle">1.5</text>
    <text x="430" y="362" text-anchor="middle">2</text>
    <text x="488.7" y="362" text-anchor="middle">3</text>
    <text x="547.3" y="362" text-anchor="middle">4</text>
    <text x="606" y="362" text-anchor="middle">5</text>
    <text x="664.7" y="362" text-anchor="middle">6</text>
    <text x="723.3" y="362" text-anchor="middle">8</text>
    <text x="782" y="362" text-anchor="middle">10</text>
    <text x="430" y="392" text-anchor="middle" font-size="12" fill="#111827">Offered load (rps)</text>
    <text transform="translate(24 209) rotate(-90)" text-anchor="middle" font-size="12" fill="#111827">p95 TTFT</text>
  </g>

  <text x="606" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#065f46">646 ms</text>
  <text x="673" y="252" font-family="Arial, sans-serif" font-size="11" fill="#92400e">5.47s</text>
  <text x="734" y="154" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">12.2s</text>
  <text x="742" y="82" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">17.3s</text>
</svg>
